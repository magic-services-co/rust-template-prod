openapi: 3.0.3
info:
  title: Rust Web Template API
  description: |
    API documentation for the Rust Web Template.
    
    ## Authentication
    
    This API supports multiple authentication methods:
    
    1. **Session Authentication** - Login via NextAuth (Discord/Steam OAuth)
    2. **API Key Authentication** - Pass `x-api-key` header
    3. **Bearer Token Authentication** - Pass `Authorization: Bearer <token>` header
    
    ## Permissions
    
    Most endpoints require specific permissions. Permissions are either:
    - **Role-based** - Assigned to user roles (e.g., `leaderboard:manage`)
    - **API Key-based** - Configured per API key (e.g., `admin.users.list`)
    - **Admin-only** - Requires `isAdmin: true` flag
    
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: /api
    description: API Base URL

tags:
  - name: Public
    description: Public-facing endpoints
  - name: Auth
    description: Authentication endpoints
  - name: User
    description: User management endpoints
  - name: Admin - Users
    description: Admin user management
  - name: Admin - Tickets
    description: Admin ticket management
  - name: Admin - Servers
    description: Admin server management
  - name: Admin - Bans
    description: Admin ban management
  - name: Admin - Settings
    description: Admin settings management
  - name: Admin - Roles
    description: Admin role management
  - name: Admin - Leaderboard
    description: Admin leaderboard management
  - name: Admin - Map Voting
    description: Admin map voting management
  - name: Admin - CDN
    description: Admin CDN/image management
  - name: Admin - Theme
    description: Admin theme customization
  - name: Admin - Store
    description: Admin store management

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API key authentication
    BearerAuth:
      type: http
      scheme: bearer
      description: Bearer token authentication
    SessionAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: NextAuth session cookie

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message

    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        image:
          type: string
        isAdmin:
          type: boolean
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'

    Account:
      type: object
      properties:
        provider:
          type: string
          enum: [discord, steam]
        providerAccountId:
          type: string

    UserRole:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/Role'

    Role:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
        discordRoleId:
          type: string

    Server:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        ip:
          type: string
        port:
          type: integer
        queryPort:
          type: integer
        players:
          type: integer
        maxPlayers:
          type: integer
        map:
          type: string
        categoryId:
          type: string

    Ban:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        steamId:
          type: string
        reason:
          type: string
        banType:
          type: string
        isActive:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    Ticket:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        categoryId:
          type: string
        status:
          type: string
          enum: [open, closed, pending]
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: '#/components/schemas/TicketMessage'

    TicketMessage:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        isStaff:
          type: boolean
        createdAt:
          type: string
          format: date-time

    TicketCategory:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        emoji:
          type: string
        order:
          type: integer

    ApiKey:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        permissions:
          type: object
        createdAt:
          type: string
          format: date-time

    PaginatedResponse:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

paths:
  # ==================== PUBLIC ====================
  /servers:
    get:
      tags: [Public]
      summary: Get all servers
      description: Returns list of all game servers
      security:
        - {}
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of servers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Server'

  /stats:
    get:
      tags: [Public]
      summary: Get statistics
      description: Get player statistics and leaderboard data
      security:
        - {}
        - ApiKeyAuth: []
      responses:
        '200':
          description: Statistics data

  /maps:
    get:
      tags: [Public]
      summary: Get maps
      description: Get available maps
      security:
        - {}
        - ApiKeyAuth: []
      responses:
        '200':
          description: Maps data

  /leaderboard-tabs:
    get:
      tags: [Public]
      summary: Get leaderboard tabs
      description: Get leaderboard tab configuration
      security:
        - {}
        - ApiKeyAuth: []
      responses:
        '200':
          description: Leaderboard tabs

  /leaderboard-settings:
    get:
      tags: [Public]
      summary: Get leaderboard settings
      description: Get public leaderboard settings
      responses:
        '200':
          description: Leaderboard settings

  /players:
    get:
      tags: [Public]
      summary: Get players
      description: Get player data
      security:
        - ApiKeyAuth: []
        - SessionAuth: []
      responses:
        '200':
          description: Player data
        '403':
          description: Insufficient permissions

  /bans/check:
    post:
      tags: [Public]
      summary: Check ban status
      description: Check if a user is banned
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [steamId]
              properties:
                steamId:
                  type: string
      responses:
        '200':
          description: Ban status
          content:
            application/json:
              schema:
                type: object
                properties:
                  banned:
                    type: boolean
                  ban:
                    $ref: '#/components/schemas/Ban'
        '401':
          description: Unauthorized

  /bans/check-fast:
    post:
      tags: [Public]
      summary: Check ban status (fast)
      description: Optimized ban check endpoint
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [steamId]
              properties:
                steamId:
                  type: string
      responses:
        '200':
          description: Ban status

  /bans/check-batch:
    post:
      tags: [Public]
      summary: Batch check ban status
      description: Check multiple users for bans
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [steamIds]
              properties:
                steamIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Ban statuses

  /bans/check-batch-fast:
    post:
      tags: [Public]
      summary: Batch check ban status (fast)
      description: Optimized batch ban check
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [steamIds]
              properties:
                steamIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Ban statuses

  /vote:
    post:
      tags: [Public]
      summary: Submit vote
      description: Submit a vote
      security:
        - SessionAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mapId:
                  type: string
                serverId:
                  type: string
      responses:
        '200':
          description: Vote submitted

  /support/{slug}:
    get:
      tags: [Public]
      summary: Get support article
      description: Get support article by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Support article
        '404':
          description: Not found

  /support:
    post:
      tags: [Public]
      summary: Create support request
      description: Create a new support request
      security:
        - SessionAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                message:
                  type: string
                categoryId:
                  type: string
      responses:
        '200':
          description: Support request created

  /discord/sync-roles:
    post:
      tags: [Public]
      summary: Sync Discord roles
      description: Sync Discord roles for a user
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                discordId:
                  type: string
      responses:
        '200':
          description: Roles synced

  /discord/roles:
    get:
      tags: [Public]
      summary: Get Discord roles
      description: Get available Discord roles
      responses:
        '200':
          description: Discord roles

  /discord-members:
    get:
      tags: [Public]
      summary: Get Discord member count
      description: Get Discord server member count
      responses:
        '200':
          description: Member count

  /redirects:
    get:
      tags: [Public]
      summary: Get redirects
      description: Get site redirects
      security:
        - {}
        - ApiKeyAuth: []
      responses:
        '200':
          description: Redirects

  /sitemap:
    get:
      tags: [Public]
      summary: Get sitemap
      description: Get sitemap data
      security:
        - {}
        - ApiKeyAuth: []
      responses:
        '200':
          description: Sitemap data

  /site-settings:
    get:
      tags: [Public]
      summary: Get site settings
      description: Get public site settings
      responses:
        '200':
          description: Site settings

  /theme-settings:
    get:
      tags: [Public]
      summary: Get theme settings
      description: Get theme settings
      responses:
        '200':
          description: Theme settings

  /server-pages:
    get:
      tags: [Public]
      summary: Get server pages
      description: Get server page configurations
      responses:
        '200':
          description: Server pages

  /legal/terms-of-service:
    get:
      tags: [Public]
      summary: Get terms of service
      responses:
        '200':
          description: Terms of service

  /legal/privacy-policy:
    get:
      tags: [Public]
      summary: Get privacy policy
      responses:
        '200':
          description: Privacy policy

  /linked-users-count:
    get:
      tags: [Public]
      summary: Get linked users count
      description: Get count of linked users
      responses:
        '200':
          description: User count

  # ==================== AUTH ====================
  /auth/check-permission:
    post:
      tags: [Auth]
      summary: Check permission
      description: Check if the current user has a specific permission
      security:
        - SessionAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource, action]
              properties:
                resource:
                  type: string
                action:
                  type: string
      responses:
        '200':
          description: Permission check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasPermission:
                    type: boolean

  # ==================== USER ====================
  /user:
    get:
      tags: [User]
      summary: Get current user
      description: Get current authenticated user's data
      security:
        - SessionAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [discord, oxide]
          description: Type of data to retrieve
      responses:
        '200':
          description: User data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

  /user/search/{id}:
    get:
      tags: [User]
      summary: Search user by ID
      description: Search for a user by ID
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User data
        '404':
          description: User not found

  /user/steam/{id}:
    get:
      tags: [User]
      summary: Get Steam user
      description: Get Steam user data by Steam ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Steam user data

  /user/discord/{id}:
    get:
      tags: [User]
      summary: Get Discord user
      description: Get Discord user data by Discord ID
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Discord user data

  /user/oxide:
    get:
      tags: [User]
      summary: Get Oxide user data
      description: Get Oxide-specific user data
      security:
        - SessionAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Oxide user data
        '403':
          description: Insufficient permissions

  /user/nitro:
    get:
      tags: [User]
      summary: Get Nitro status
      description: Get user's Discord Nitro status
      security:
        - SessionAuth: []
      responses:
        '200':
          description: Nitro status

  /user/unlink:
    post:
      tags: [User]
      summary: Unlink account
      description: Unlink a connected account
      security:
        - SessionAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider:
                  type: string
                  enum: [steam, discord]
      responses:
        '200':
          description: Account unlinked

  # ==================== ADMIN - USERS ====================
  /admin/users:
    get:
      tags: [Admin - Users]
      summary: List users
      description: |
        Get paginated list of users.
        
        **Permission:** `user_linked:read` OR `user_full:read`
      security:
        - SessionAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      users:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

    put:
      tags: [Admin - Users]
      summary: Update user
      description: |
        Update a user's data.
        
        **Permission:** `user:manage`
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                data:
                  type: object
      responses:
        '200':
          description: User updated
        '401':
          description: Unauthorized

  /admin/user-count:
    get:
      tags: [Admin - Users]
      summary: Get user count
      description: Get total user count with optional filters
      security:
        - SessionAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: User count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer

  /admin/users/search:
    get:
      tags: [Admin - Users]
      summary: Search users
      description: Search for users
      security:
        - SessionAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Search results

  /admin/users/linked:
    get:
      tags: [Admin - Users]
      summary: Get linked users
      description: Get list of linked users
      security:
        - SessionAuth: []
      responses:
        '200':
          description: Linked users

  /admin/users/{id}/history:
    get:
      tags: [Admin - Users]
      summary: Get user history
      description: Get a user's activity history
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User history

  /admin/users/{id}/ban:
    post:
      tags: [Admin - Users]
      summary: Ban user
      description: Ban a user
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                duration:
                  type: integer
                  nullable: true
                banType:
                  type: string
      responses:
        '200':
          description: User banned

  /admin/users/{id}/unban:
    post:
      tags: [Admin - Users]
      summary: Unban user
      description: Unban a user
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User unbanned

  # ==================== ADMIN - TICKETS ====================
  /admin/tickets:
    get:
      tags: [Admin - Tickets]
      summary: List tickets
      description: Get paginated list of support tickets
      security:
        - SessionAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 10
        - name: userId
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [all, open, closed, pending]
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Ticket list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      tickets:
                        type: array
                        items:
                          $ref: '#/components/schemas/Ticket'

  /admin/tickets/{id}:
    get:
      tags: [Admin - Tickets]
      summary: Get ticket
      description: Get a specific ticket with messages
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ticket data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          description: Ticket not found

    patch:
      tags: [Admin - Tickets]
      summary: Update ticket
      description: Update a ticket
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                assignedTo:
                  type: string
      responses:
        '200':
          description: Ticket updated

  /admin/tickets/{id}/status:
    patch:
      tags: [Admin - Tickets]
      summary: Update ticket status
      description: Update ticket status
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [open, closed, pending]
      responses:
        '200':
          description: Status updated

  /admin/tickets/{id}/messages:
    get:
      tags: [Admin - Tickets]
      summary: Get ticket messages
      description: Get messages for a ticket
      security:
        - SessionAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ticket messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketMessage'

    post:
      tags: [Admin - Tickets]
      summary: Create ticket message
      description: Add a message to a ticket
      security:
        - SessionAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                isStaff:
                  type: boolean
      responses:
        '200':
          description: Message created

  /admin/tickets/{id}/messages/{messageId}:
    delete:
      tags: [Admin - Tickets]
      summary: Delete ticket message
      description: |
        Delete a ticket message.
        
        **Permission:** `tickets:manage`
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Message deleted

  /admin/ticket-settings:
    get:
      tags: [Admin - Tickets]
      summary: Get ticket settings
      description: |
        Get ticket category settings.
        
        **Permission:** `settings:manage`
      security:
        - SessionAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Ticket settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketCategory'

    post:
      tags: [Admin - Tickets]
      summary: Create ticket category
      description: |
        Create a new ticket category.
        
        **Permission:** `settings:manage`
      security:
        - SessionAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
                emoji:
                  type: string
      responses:
        '200':
          description: Category created

    put:
      tags: [Admin - Tickets]
      summary: Update ticket settings
      description: |
        Update ticket category settings.
        
        **Permission:** `settings:manage`
      security:
        - SessionAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCategory'
      responses:
        '200':
          description: Settings updated

    delete:
      tags: [Admin - Tickets]
      summary: Delete ticket category
      description: |
        Delete a ticket category.
        
        **Permission:** `settings:manage`
      security:
        - SessionAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
